name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'

permissions:
  contents: read

env:
  PKG_NAME: openwrt-mcp
  APK_ARCH: aarch64_cortex-a53

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Extract version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^var version = "\(.*\)"/\1/p' main.go)
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install apk-tools 3
        run: |
          set -eu
          apk_pkg=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/ |
            sed -n 's/.*href="\(apk-tools-static-[^"]*\.apk\)".*/\1/p' | tail -1)
          test -n "$apk_pkg"
          curl -fsSL -o /tmp/apk-tools-static.apk \
            "https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/$apk_pkg"
          mkdir -p /tmp/apk-tools-static
          tar -xzf /tmp/apk-tools-static.apk -C /tmp/apk-tools-static
          echo /tmp/apk-tools-static/sbin >> "$GITHUB_PATH"

      - name: Build APK
        run: make apk APK_ARCH="$APK_ARCH" VERSION="${{ steps.version.outputs.version }}"

      - name: Verify package contents
        run: |
          set -eu
          package="${PKG_NAME}_${{ steps.version.outputs.version }}_${APK_ARCH}.apk"
          test -f "$package"
          mkdir /tmp/apk-extract
          (cd /tmp/apk-extract && apk.static --allow-untrusted extract "$GITHUB_WORKSPACE/$package")
          for path in \
            usr/bin/openwrt-mcp \
            etc/init.d/openwrt-mcp \
            etc/config/openwrt-mcp \
            lib/upgrade/keep.d/openwrt-mcp; do
            test -f "/tmp/apk-extract/$path"
          done

      - name: Prepare artifacts
        run: |
          set -eu
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist/source
          cp "${PKG_NAME}_${version}_${APK_ARCH}.apk" dist/
          mkdir -p "dist/source/${PKG_NAME}_${version}"
          cp -r files ui go.mod go.sum *.go Makefile mkapk.sh \
            "dist/source/${PKG_NAME}_${version}/"
          tar -czf "dist/${PKG_NAME}_${version}_src.tar.gz" \
            -C dist/source "${PKG_NAME}_${version}"
          rm -rf dist/source
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install

            Download the APK for `aarch64_cortex-a53`, then run:

            ```sh
            apk add --allow-untrusted openwrt-mcp-*.apk
            ```

            The source archive contains the files needed to build the package locally with
            `make apk`.
          files: release/*

  pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: site

      - name: Install apk-tools 3
        run: |
          set -eu
          apk_pkg=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/ |
            sed -n 's/.*href="\(apk-tools-static-[^"]*\.apk\)".*/\1/p' | tail -1)
          test -n "$apk_pkg"
          curl -fsSL -o /tmp/apk-tools-static.apk \
            "https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/$apk_pkg"
          mkdir -p /tmp/apk-tools-static
          tar -xzf /tmp/apk-tools-static.apk -C /tmp/apk-tools-static
          echo /tmp/apk-tools-static/sbin >> "$GITHUB_PATH"

      - name: Create signed APK feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/packages/apk site/keys
          apk=$(find site -maxdepth 1 -name '*.apk' -printf '%f\n' | head -n 1)
          source_archive=$(find site -maxdepth 1 -name '*_src.tar.gz' -printf '%f\n' | head -n 1)
          test -n "$apk"
          test -n "$source_archive"
          cp "site/$apk" site/packages/apk/
          openssl genrsa -out site/private-key.pem 2048 >/dev/null 2>&1
          openssl rsa -in site/private-key.pem -pubout -out site/keys/openwrt-mcp-apk.pem >/dev/null 2>&1
          chmod 600 site/private-key.pem
          (
            cd site/packages/apk
            apk.static mkndx \
              --root "$GITHUB_WORKSPACE/site" \
              --keys-dir "$GITHUB_WORKSPACE/site/keys" \
              --allow-untrusted \
              --sign "$GITHUB_WORKSPACE/site/private-key.pem" \
              --output packages.adb *.apk
          )
          rm -f site/private-key.pem

      - name: Create download page
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find site -maxdepth 1 -name '*.apk' -printf '%f\n' | head -n 1)
          source_archive=$(find site -maxdepth 1 -name '*_src.tar.gz' -printf '%f\n' | head -n 1)
          test -n "$apk"
          test -n "$source_archive"
          APK_PATH="$apk" SOURCE_ARCHIVE="$source_archive" python - <<'PY'
          import os
          apk = os.environ['APK_PATH']
          source_archive = os.environ['SOURCE_ARCHIVE']
          install_example = """ssh root@192.168.0.1 'cat /etc/apk/arch'
          ssh root@192.168.0.1 <<'APK_EOF'
          wget -O /etc/apk/keys/openwrt-mcp-apk.pem \
            https://dawklicrypto.github.io/openwrt-mcp/keys/openwrt-mcp-apk.pem
          printf '%s\\n' \
            'https://dawklicrypto.github.io/openwrt-mcp/packages/apk/packages.adb' \
            >> /etc/apk/repositories.d/customfeeds.list
          apk update
          apk add openwrt-mcp
          APK_EOF"""
          html = f'''<!doctype html>
          <meta charset="utf-8">
          <title>openwrt-mcp downloads</title>
          <h1>openwrt-mcp {os.environ.get("GITHUB_REF_NAME", "dev")}</h1>
          <ul>
            <li><a href="./{apk}">Download APK ({os.environ.get("APK_ARCH", "aarch64_cortex-a53")})</a></li>
            <li><a href="./{source_archive}">Download source archive</a></li>
            <li><a href="./keys/openwrt-mcp-apk.pem">Download public signing key</a></li>
            <li><a href="./packages/apk/packages.adb">OpenWrt APK feed index</a></li>
          </ul>
          <h2>Feed-style install</h2>
          <pre><code>{install_example}</code></pre>
          '''
          with open('site/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5