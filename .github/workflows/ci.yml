name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1

      - name: install apk-tools 3
        run: |
          set -eu
          apk_pkg=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/ |
            sed -n 's/.*href="\(apk-tools-static-[^"]*\.apk\)".*/\1/p' | tail -1)
          curl -fsSL -o /tmp/apk-tools-static.apk \
            "https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/$apk_pkg"
          mkdir -p /tmp/apk-tools-static
          tar -xzf /tmp/apk-tools-static.apk -C /tmp/apk-tools-static
          echo /tmp/apk-tools-static/sbin >> "$GITHUB_PATH"

      # The package is only useful if it builds for the router, so build it here
      # rather than finding out at install time on someone's only router.
      - name: cross-build and package
        run: make apk

      - name: the package must contain what the router needs
        run: |
          set -eu
          # Exactly one package, or the assertions below would test the wrong file.
          n=$(ls openwrt-mcp-*.apk | wc -l)
          [ "$n" -eq 1 ] || { echo "expected 1 .apk, found $n"; ls openwrt-mcp-*.apk; exit 1; }
          apk=$(ls openwrt-mcp-*.apk)
          mkdir /tmp/apk-extract
          (cd /tmp/apk-extract && apk.static --allow-untrusted extract "$GITHUB_WORKSPACE/$apk")
          for f in usr/bin/openwrt-mcp etc/init.d/openwrt-mcp \
                   etc/config/openwrt-mcp lib/upgrade/keep.d/openwrt-mcp; do
            [ -f "/tmp/apk-extract/$f" ] || { echo "missing from package: $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-mcp-apk
          path: openwrt-mcp-*.apk
